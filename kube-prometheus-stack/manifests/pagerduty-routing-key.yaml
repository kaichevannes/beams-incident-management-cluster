apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pagerduty-routing-key
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: pagerduty-routing-key
    creationPolicy: Owner
  data:
    - secretKey: routing-key
      remoteRef:
        key: pagerduty/beams-incident-management-routing-key
