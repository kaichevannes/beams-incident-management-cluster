apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beams-incident-management-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: kaichevannes-teleport.uk-incident-k3s
    namespace: default
  source:
    repoURL: https://github.com/kaichevannes/beams-incident-management-cluster.git
    targetRevision: main
    path: rbac
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
