apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beams-incident-management-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    name: kaichevannes-teleport.uk-incident-k3s
    namespace: external-secrets
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
    - repoURL: https://github.com/kaichevannes/teleport-lab.git
      targetRevision: main
      path: terraform/labs/beams-incident-management/kubernetes/external-secrets/manifests
      directory:
        recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
